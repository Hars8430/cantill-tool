# TEMPLATE for the blind-test company. Copy to configs/companyC.yaml on Thursday and fill in every
# value marked FILL. Nothing in src/ should need changing: if it does, record why in DECISIONS.md.
# Run:  python -m src.cantill.run configs/companyC.yaml

company: C                       # C uses the one-system path (same as B); A is the two-system path
reporting_currency: USD          # FILL: the currency the tree and totals are reported in
output_prefix: harsh_singh

files:
  invoices: data/raw/company_C/FILL.csv          # FILL: the blind-test invoice file
  fx: data/raw/company_C/fx_rates_usd.csv        # FILL: only if the data has non-USD lines
  taxonomy: data/raw/company_C/FILL_taxonomy.csv # FILL: the unseen category tree

invoices:
  record_id: FILL                 # unique per line
  vendor_id: FILL                 # FILL (or null if the file has supplier names only)
  supplier_name: FILL_or_null
  description: FILL               # the line text the classifier reads
  material: FILL_or_null
  gl_description: FILL_or_null    # used for intercompany exclusion
  document_type: FILL_or_null
  date: FILL
  date_formats: ["%Y-%m-%d"]      # FILL: add the formats seen in the file
  amount: FILL
  amount_is_net: true             # FILL: check whether amounts include VAT and record the answer
  currency: FILL
  currency_rate: FILL_or_null
  quantity: FILL_or_null
  status: null                    # FILL: a status column and its values, if any

fx:
  currency_col: currency
  month_col: month
  rate_col: units_per_usd
  month_from: posting_date

exclusions:
  non_procurement:
    gl_description_patterns:
      - "^IC"
      - "^I/C"
      - "INTERCOMPANY"
    description_patterns:
      - "\\bTAX"
      - "\\bGST\\b"
      - "\\bVAT\\b"

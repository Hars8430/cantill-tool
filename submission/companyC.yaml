# configs/companyC.yaml
# KNOWN LIMITATIONS (stated honestly):
#  - Cancelled lines (106) are excluded as NOT_APPROVED, not CANCELLED: the one-system path cannot read status.
#  - Tax rule is a text match. A few real purchases mention "GST" or "tax included" and are excluded.
#  - Level 4 of the four-level tree is not written (the tool writes three levels).
#  - Supplier key is the supplier name (no vendor IDs), so suppliers are not merged.
#  - Input preparation: data/prep_C.py (a data step run before the unchanged tool).
# Company C: one system, USD amounts, supplier names only (no vendor IDs), four-level tree (level 4 not scored).
# Data was prepared by data/prep_C.py (a data step, no code change). Cancelled lines were blanked, so the
# tool excludes them as NOT_APPROVED. Their code would be CANCELLED if the tool could read status.

company: C
reporting_currency: USD
output_prefix: harsh_singh
output_tag: C

files:
  invoices: data/blind/C/prepared/invoice_lines.csv
  fx: data/blind/C/prepared/fx_empty.csv
  taxonomy: data/blind/C/prepared/taxonomy_C.csv

invoices:
  record_id: line_id
  vendor_id: vendor_id
  supplier_name: null
  description: line_description
  material: material_number
  gl_description: gl_account_description
  document_type: null
  date: posting_date
  date_formats: ["%Y-%m-%d"]
  amount: line_amount
  amount_is_net: true
  currency: currency
  currency_rate: currency_rate
  quantity: quantity
  status: null

fx:
  currency_col: currency
  month_col: month
  rate_col: units_per_usd
  month_from: posting_date

exclusions:
  non_procurement:
    gl_description_patterns:
      - "^IC"
      - "^I/C"
      - "INTERCOMPANY"
    description_patterns:
      - "\\bTAX"
      - "\\bGST\\b"
      - "\\bVAT\\b"
